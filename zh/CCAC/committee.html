<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CACC2026 委员会</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .committee-main {
            width: min(1100px, calc(100% - 3rem));
            margin: 2.6rem auto 4rem;
            display: grid;
            gap: 1.2rem;
        }

        .committee-group .content-head {
            margin-bottom: 0.9rem;
        }

        .member-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.9rem;
        }

        .member-grid.wide {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .member-card {
            border: 1px solid rgba(143, 155, 173, 0.35);
            border-radius: 14px;
            padding: 0.9rem;
            background: linear-gradient(130deg, #ffffff, rgba(245, 248, 252, 0.95));
            text-align: center;
        }

        .member-card img {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(47, 71, 99, 0.2);
            display: block;
            margin: 0 auto 0.7rem;
        }

        .member-card h3 {
            font-size: 1rem;
            margin-bottom: 0.35rem;
        }

        .member-card p {
            margin: 0;
            font-size: 0.93rem;
        }

        @media (max-width: 900px) {
            .committee-main {
                width: min(1100px, calc(100% - 1rem));
                margin-top: 1.3rem;
            }

            .member-grid,
            .member-grid.wide {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">主页</a>

                <a class="nav-link active" href="committee.html">委员会</a>
                <a class="nav-link" href="https://www.wjx.cn/" target="_blank" rel="noopener noreferrer">报名问卷</a>
                <a class="nav-link" href="faq.html">FAQ</a>
            </div>
        </div>
    </nav>

    <main class="committee-main">
        <section class="content-block">
            <div class="content-head">
                <h1>委员会</h1>
            </div>
        </section>

                    <h3>中国科学院心理研究所</h3>

                <article class="member-card">
                    <img src="https://placehold.co/240x240/e9edf3/4a5d74?text=%E4%B8%BB%E5%8A%9E%E6%96%B9+B" alt="主办方B照片">
                    <h3>CCAC 2026 组委会</h3>
                </article>
            </div>
        </section>

        <section class="content-block committee-group">

                    <h3>中国科学院心理研究所</h3>

        <section class="content-block committee-group">
